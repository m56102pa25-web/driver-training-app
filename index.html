<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>業務ガイド｜ジャパンフーズ物流</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="業務ガイド">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #007AFF;
  --blue-dark: #0060D0;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #1C1C1E;
  --muted: #8E8E93;
  --border: rgba(0,0,0,0.1);
  --red: #FF3B30;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }

/* ---- sticky header + tabs ---- */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--card);
  border-bottom: 0.5px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.hdr {
  padding: 14px 20px 10px;
}
.hdr .company {
  font-size: 11px;
  color: var(--blue);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 3px;
}
.hdr h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.3px;
}

/* ---- tab bar ---- */
.tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 8px 12px 10px;
  gap: 6px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: #F2F2F7;
  border: none;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  color: var(--muted);
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.tab-btn.active {
  background: var(--blue);
  color: #fff;
  font-weight: 700;
}

/* ---- content area ---- */
.content {
  padding: 16px;
  padding-bottom: 40px;
}

/* ---- タブ切替スライドアニメーション ---- */
@keyframes slideFromRight {
  from { opacity: 0.3; transform: translateX(80%); }
  to   { opacity: 1;   transform: translateX(0); }
}
@keyframes slideFromLeft {
  from { opacity: 0.3; transform: translateX(-80%); }
  to   { opacity: 1;   transform: translateX(0); }
}
.content.anim-fwd  { animation: slideFromRight 0.33s cubic-bezier(0.25, 0.8, 0.35, 1); }
.content.anim-back { animation: slideFromLeft 0.33s cubic-bezier(0.25, 0.8, 0.35, 1); }

/* ---- section label ---- */
.sec-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin: 22px 4px 10px;
}
.sec-label:first-child { margin-top: 4px; }

/* ---- step card ---- */
.step-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 13px;
  align-items: flex-start;
}
.step-num {
  min-width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  font-family: ui-monospace, 'JetBrains Mono', monospace;
}
.step-body { flex: 1; min-width: 0; }
.step-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.35; }
.step-desc {
  font-size: 13px;
  color: #444;
  margin-top: 5px;
  line-height: 1.7;
}
.step-point {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--blue);
  background: rgba(0,122,255,0.07);
  border-radius: 7px;
  padding: 7px 10px;
  line-height: 1.6;
}
.step-caution {
  margin-top: 8px;
  font-size: 12.5px;
  color: #C0392B;
  background: rgba(255,59,48,0.07);
  border-radius: 7px;
  padding: 7px 10px;
  line-height: 1.6;
}

/* ---- company overview ---- */
.company-card {
  background: var(--card);
  border-radius: 16px;
  padding: 18px 18px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.company-card .label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.company-card h2 {
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
}
.company-card p {
  margin: 0;
  font-size: 14px;
  color: #444;
  line-height: 1.8;
}
.link-group {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.link-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 16px;
  text-decoration: none;
  color: inherit;
}
.link-row + .link-row { border-top: 0.5px solid var(--border); }
.link-icon { font-size: 22px; width: 26px; text-align: center; }
.link-text { flex: 1; }
.link-title { font-size: 15px; font-weight: 500; color: var(--text); }
.link-sub { font-size: 13px; color: var(--blue); margin-top: 1px; }
.link-chevron { color: #C7C7CC; font-size: 20px; line-height: 1; }

/* ---- company hero image ---- */
.company-hero {
  width: 100%;
  border-radius: 14px;
  display: block;
  margin-bottom: 16px;
}
</style>
</head>

      <h1>業務ガイド</h1>
    </div>
    <nav class="tabs" id="tabBar" role="tablist"></nav>
  </div>

  <main class="content" id="mainContent"></main>

</div>

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TABS.map(t =>
    `<button class="tab-btn${t.id === activeTab ? ' active' : ''}"
      onclick="switchTab('${t.id}')"
      role="tab" aria-selected="${t.id === activeTab}"
    >${t.label}</button>`
  ).join('');

  // アクティブタブを見えるようにスクロール
  setTimeout(() => {
    const active = bar.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }, 0);
}

function switchTab(id) {
  const oldIdx = TABS.findIndex(t => t.id === activeTab);
  const newIdx = TABS.findIndex(t => t.id === id);
  if (newIdx === oldIdx) return;

  activeTab = id;
  renderTabBar();
  renderContent();
  requestAnimationFrame(() => window.scrollTo(0, 0));

  // スライドアニメーション（次のタブ→右から / 前のタブ→左から）
  const main = document.getElementById('mainContent');
  main.classList.remove('anim-fwd', 'anim-back');
  void main.offsetWidth; // アニメーションを再生し直すためリフロー
  main.classList.add(newIdx > oldIdx ? 'anim-fwd' : 'anim-back');
}

renderTabBar();
renderContent();

/* ---- スワイプでタブ切替 ---- */
(function() {
  let startX = 0, startY = 0;
  const content = document.getElementById('mainContent');

  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    const idx = TABS.findIndex(t => t.id === activeTab);
    if (dx < 0 && idx < TABS.length - 1) switchTab(TABS[idx + 1].id);
    if (dx > 0 && idx > 0) switchTab(TABS[idx - 1].id);
  }, { passive: true });
})();
