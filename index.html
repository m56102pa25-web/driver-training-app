<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>業務ガイド｜ジャパンフーズ物流</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="業務ガイド">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #007AFF;
  --blue-dark: #0060D0;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #1C1C1E;
  --muted: #8E8E93;
  --border: rgba(0,0,0,0.1);
  --red: #FF3B30;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  height: 100%;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---- fixed header + tabs ---- */
.sticky-top {
  flex-shrink: 0;
  z-index: 20;
  background: var(--card);
  border-bottom: 0.5px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.hdr {
  padding: 14px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.hdr-text { min-width: 0; }
.search-btn {
  background: #F2F2F7;
  border: none;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ---- search ---- */
.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px 10px;
}
.search-row[hidden] { display: none; }
.search-row input {
  flex: 1;
  min-width: 0;
  border: none;
  background: #F2F2F7;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}
.search-row button {
  background: none;
  border: none;
  color: var(--blue);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  padding: 4px 2px;
  flex-shrink: 0;
}
.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px calc(40px + env(safe-area-inset-bottom));
}
.search-results[hidden] { display: none; }
.app.searching .panels-wrapper { display: none; }
.search-result {
  background: var(--card);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.search-result .sr-tab {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.05em;
}
.search-result .sr-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
}
.search-result .sr-snippet {
  font-size: 12.5px;
  color: #666;
  margin-top: 4px;
  line-height: 1.6;
}
.search-result mark {
  background: rgba(0,122,255,0.15);
  color: var(--blue-dark);
  border-radius: 3px;
  padding: 0 1px;
}
.search-empty {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-top: 40px;
}
.hdr .company {
  font-size: 11px;
  color: var(--blue);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 3px;
}
.hdr h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.3px;
}

/* ---- tab bar ---- */
.tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 8px 12px 10px;
  gap: 6px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: #F2F2F7;
  border: none;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  color: var(--muted);
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.tab-btn.active {
  background: var(--blue);
  color: #fff;
  font-weight: 700;
}

/* ---- content area ---- */
.panels-wrapper {
  flex: 1;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.panels-wrapper::-webkit-scrollbar { display: none; }
.panel {
  flex-shrink: 0;
  width: 100%;
  scroll-snap-align: start;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}


/* ---- section label ---- */
.sec-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin: 22px 4px 10px;
}
.sec-label:first-child { margin-top: 4px; }

/* ---- step card ---- */
.step-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 13px;
  align-items: flex-start;
}
.step-num {
  min-width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  font-family: ui-monospace, 'JetBrains Mono', monospace;
}
.step-body { flex: 1; min-width: 0; }
.step-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.35; }
.step-desc {
  font-size: 13px;
  color: #444;
  margin-top: 5px;
  line-height: 1.7;
}
.step-point {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--blue);
  background: rgba(0,122,255,0.07);
  border-radius: 7px;
  padding: 7px 10px;
  line-height: 1.6;
}
.step-caution {
  margin-top: 8px;
  font-size: 12.5px;
  color: #C0392B;
  background: rgba(255,59,48,0.07);
  border-radius: 7px;
  padding: 7px 10px;
  line-height: 1.6;
}

/* ---- accordion ---- */
.step-card { cursor: pointer; }
.step-chevron {
  margin-left: auto;
  font-size: 11px;
  color: #bbb;
  transition: transform 0.25s ease;
  flex-shrink: 0;
  align-self: center;
  padding-left: 6px;
}
.step-card.open .step-chevron { transform: rotate(180deg); }
.step-content { display: none; }
.step-card.open .step-content {
  display: block;
  animation: acFadeIn 0.2s ease;
}
@keyframes acFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- company overview ---- */
.company-card {
  background: var(--card);
  border-radius: 16px;
  padding: 18px 18px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.company-card .label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.company-card h2 {
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
}
.company-card p {
  margin: 0;
  font-size: 14px;
  color: #444;
  line-height: 1.8;
}
.link-group {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.link-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 16px;
  text-decoration: none;
  color: inherit;
}
.link-row + .link-row { border-top: 0.5px solid var(--border); }
.link-icon { font-size: 22px; width: 26px; text-align: center; }
.link-text { flex: 1; }
.link-title { font-size: 15px; font-weight: 500; color: var(--text); }
.link-sub { font-size: 13px; color: var(--blue); margin-top: 1px; }
.link-chevron { color: #C7C7CC; font-size: 20px; line-height: 1; }

/* ---- company hero image (Ken Burns) ---- */
.company-hero-wrap {
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.company-hero {
  width: 100%;
  display: block;
  animation: heroIn 1.1s ease-out both;
}
@keyframes heroIn {
  from { opacity: 0; transform: scale(1.06); }
  to   { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .company-hero { animation: none; }
}
</style>
</head>
<body>
<div class="app">

  <div class="sticky-top">
    <div class="hdr">
      <div class="hdr-text">
        <div class="company">ジャパンフーズ物流株式会社</div>
        <h1>業務ガイド</h1>
      </div>
      <button class="search-btn" id="searchBtn" aria-label="検索">🔍</button>
    </div>
    <div class="search-row" id="searchRow" hidden>
      <input id="searchInput" type="search" placeholder="キーワード検索（例：輪留め）" autocomplete="off">
      <button id="searchCancel">キャンセル</button>
    </div>
    <nav class="tabs" id="tabBar" role="tablist"></nav>
  </div>

  <div class="search-results" id="searchResults" hidden></div>
  <div class="panels-wrapper" id="panelsWrapper"></div>

</div>

/* ========== 描画 ========== */
let activeTab = 'company';

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TABS.map(t =>
    `<button class="tab-btn${t.id === activeTab ? ' active' : ''}"
      onclick="switchTab('${t.id}')"
      role="tab" aria-selected="${t.id === activeTab}"
    >${t.label}</button>`
  ).join('');

  // アクティブタブを見えるようにスクロール
  setTimeout(() => {
    const active = bar.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }, 0);
}

function renderContent(tab, target) {
  const main = target || document.getElementById('mainContent');
  if (!tab) tab = TABS.find(t => t.id === activeTab);
  if (!tab) return;

  if (tab.type === 'company') {
    main.innerHTML = `
      <div class="company-hero-wrap"><img class="company-hero" src="hero.jpg" alt="JFL"></div>
      <div class="company-card">
        <div class="label">ABOUT</div>
        <h2>ジャパンフーズ物流株式会社</h2>
        <p>名糖運輸グループの企業として、チルド食品物流のパイオニア。365日24時間体制で関東・中部を中心に全国の配送ネットワークを展開しています。</p>
      </div>
      <div class="link-group">
        <a href="https://www.jf-logistics.jp/" class="link-row" target="_blank" rel="noopener">
          <span class="link-icon">🌐</span>
          <div class="link-text">
            <div class="link-title">公式ウェブサイト</div>
            <div class="link-sub">www.jf-logistics.jp</div>
          </div>
          <span class="link-chevron">›</span>
        </a>
        <a href="https://www.jf-logistics.jp/saitama/" class="link-row" target="_blank" rel="noopener">
          <span class="link-icon">🏢</span>
          <div class="link-text">
            <div class="link-title">埼玉営業所</div>
            <div class="link-sub">www.jf-logistics.jp/saitama/</div>
          </div>
          <span class="link-chevron">›</span>
        </a>
        <a href="tel:0429550311" class="link-row">
          <span class="link-icon">📞</span>
          <div class="link-text">
            <div class="link-title">緊急連絡先（埼玉営業所）</div>
            <div class="link-sub">04-2955-0311</div>
          </div>
          <span class="link-chevron">›</span>
        </a>
      </div>`;
    return;
  }

  let html = '';
  let stepIdx = 0;
  tab.sections.forEach(sec => {
    html += `<div class="sec-label">${sec.title}</div>`;
    sec.steps.forEach(s => {
      html += `<div class="step-card" data-tab="${tab.id}" data-step="${stepIdx++}">
        <div class="step-num">${s.no}</div>
        <div class="step-body">
          <div class="step-title">${s.title}</div>
          <div class="step-content">
            <div class="step-desc">${s.desc.replace(/\n/g, '<br>')}</div>
            ${s.point ? `<div class="step-point">▶ ${s.point.replace(/\n/g, '<br>')}</div>` : ''}
            ${s.caution ? `<div class="step-caution">⚠ ${s.caution.replace(/\n/g, '<br>')}</div>` : ''}
          </div>
        </div>
        <div class="step-chevron">▼</div>
      </div>`;
    });
  });
  main.innerHTML = html;
}

function renderAllPanels() {
  const wrapper = document.getElementById('panelsWrapper');
  wrapper.innerHTML = TABS.map(t => `<div class="panel" id="panel-${t.id}"></div>`).join('');
  TABS.forEach(t => renderContent(t, document.getElementById(`panel-${t.id}`)));
}

function closeAccordion(tabId) {
  const panel = document.getElementById(`panel-${tabId}`);
  if (panel) panel.querySelectorAll('.step-card.open').forEach(c => c.classList.remove('open'));
}

function switchTab(id) {
  if (id === activeTab) return;
  closeAccordion(activeTab);
  activeTab = id;
  const idx = TABS.findIndex(t => t.id === id);
  const wrapper = document.getElementById('panelsWrapper');
  wrapper.scrollTo({ left: idx * wrapper.offsetWidth, behavior: 'smooth' });
  renderTabBar();
}

renderTabBar();
renderAllPanels();

/* アコーディオン：タップで展開／閉じる */
document.getElementById('panelsWrapper').addEventListener('click', e => {
  const card = e.target.closest('.step-card');
  if (!card) return;
  card.classList.toggle('open');
});

/* ========== 検索 ========== */
const SEARCH_INDEX = [];
TABS.forEach(t => {
  if (t.type !== 'steps') return;
  let stepIdx = 0;
  t.sections.forEach(sec => {
    sec.steps.forEach(s => {
      SEARCH_INDEX.push({
        tabId: t.id, tabLabel: t.label, secTitle: sec.title,
        stepIdx: stepIdx++, no: s.no, title: s.title,
        text: [s.desc, s.point, s.caution].filter(Boolean).join('\n')
      });
    });
  });
});

const appEl = document.querySelector('.app');
const searchRow = document.getElementById('searchRow');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

document.getElementById('searchBtn').addEventListener('click', () => {
  searchRow.hidden = false;
  searchInput.focus();
});
document.getElementById('searchCancel').addEventListener('click', closeSearch);

function closeSearch() {
  searchRow.hidden = true;
  searchResults.hidden = true;
  searchInput.value = '';
  searchResults.innerHTML = '';
  appEl.classList.remove('searching');
  // display:none解除後に横位置を元のタブに戻す
  const wrapper = document.getElementById('panelsWrapper');
  const idx = TABS.findIndex(t => t.id === activeTab);
  requestAnimationFrame(() => wrapper.scrollLeft = idx * wrapper.offsetWidth);
}

function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return '';
  const start = Math.max(0, i - 15);
  const snippet = (start > 0 ? '…' : '') + text.slice(start, i + q.length + 40) + '…';
  return snippet.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) {
    searchResults.hidden = true;
    searchResults.innerHTML = '';
    appEl.classList.remove('searching');
    return;
  }
  const hits = SEARCH_INDEX.filter(e =>
    e.title.toLowerCase().includes(q.toLowerCase()) ||
    e.text.toLowerCase().includes(q.toLowerCase())
  ).slice(0, 30);

  appEl.classList.add('searching');
  searchResults.hidden = false;
  searchResults.innerHTML = hits.length === 0
    ? `<div class="search-empty">「${q.replace(/</g, '&lt;')}」は見つかりませんでした</div>`
    : hits.map(e => `
      <div class="search-result" onclick="goToResult('${e.tabId}', ${e.stepIdx})">
        <div class="sr-tab">${e.tabLabel} › ${e.secTitle}</div>
        <div class="sr-title">${e.no} ${e.title}</div>
        <div class="sr-snippet">${highlight(e.text, q) || highlight(e.title, q)}</div>
      </div>`).join('');
});

function goToResult(tabId, stepIdx) {
  closeSearch();
  switchTab(tabId);
  setTimeout(() => {
    const panel = document.getElementById(`panel-${tabId}`);
    const card = panel?.querySelector(`.step-card[data-step="${stepIdx}"]`);
    if (!card) return;
    card.classList.add('open');
    panel.scrollTop = card.getBoundingClientRect().top - panel.getBoundingClientRect().top + panel.scrollTop - 12;
  }, 400);
}

/* スワイプでタブ同期 */
(function() {
  const wrapper = document.getElementById('panelsWrapper');
  let _t = null;
  wrapper.addEventListener('scroll', () => {
    clearTimeout(_t);
    _t = setTimeout(() => {
      const idx = Math.round(wrapper.scrollLeft / wrapper.offsetWidth);
      const newId = TABS[idx]?.id;
      if (newId && newId !== activeTab) {
        closeAccordion(activeTab);
        activeTab = newId;
        renderTabBar();
      }
    }, 80);
  }, { passive: true });
})();
